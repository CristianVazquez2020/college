<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCNC 7100 — Practice Quiz</title>
<style>
  :root{
    --accent:#1F3864; --accent2:#2E4A7d; --light:#EEF1F7; --band:#F4F6FA;
    --grey:#595959; --line:#C9D3E6;
  }
  *{box-sizing:border-box;}
  body{font-family:"Segoe UI",Calibri,Helvetica,Arial,sans-serif;color:#1c2333;
    margin:0;background:#eef0f5;line-height:1.5;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;}
  .wrap{max-width:560px;width:100%;text-align:center;}
  header.head{border-bottom:4px solid var(--accent);padding-bottom:16px;margin-bottom:28px;}
  .eyebrow{font-size:13px;font-weight:700;color:var(--grey);letter-spacing:.02em;
    text-transform:uppercase;}
  h1{color:var(--accent);font-size:32px;margin:6px 0 2px;}
  .subtitle{color:var(--grey);font-style:italic;font-size:16px;}
  .prompt{font-size:17px;font-weight:600;color:var(--accent);margin:0 0 6px;}
  .prompt .sub{display:block;font-weight:400;font-style:italic;color:var(--grey);font-size:15px;}
  .choices{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:22px;}
  a.lang{display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-decoration:none;background:#fff;border:1px solid #e2e6ef;border-radius:12px;
    padding:26px 30px;min-width:190px;box-shadow:0 1px 3px rgba(20,30,60,.06);
    transition:transform .12s,box-shadow .12s,border-color .12s;}
  a.lang:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(20,30,60,.14);
    border-color:var(--accent);}
  a.lang .flag{font-size:34px;line-height:1;margin-bottom:10px;}
  a.lang .name{font-size:20px;font-weight:700;color:var(--accent);}
  a.lang .native{font-size:14px;color:var(--grey);margin-top:2px;}
  footer{margin-top:34px;font-size:13px;color:var(--grey);}
</style>
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div class="eyebrow">CCNC 7100</div>
      <h1>Practice Quiz</h1>
      <div class="subtitle">Cuestionario de Práctica</div>
    </header>

    <p class="prompt">Choose your language
      <span class="sub">Elige tu idioma</span>
    </p>

    <div class="choices">
      <a class="lang" href="CCNC7100_Practice_Quiz.html">
        <span class="flag">🇺🇸</span>
        <span class="name">English</span>
        <span class="native">Start the quiz</span>
      </a>
      <a class="lang" href="CCNC7100_Practice_Quiz_Spanish.html">
        <span class="flag">🇲🇽</span>
        <span class="name">Español</span>
        <span class="native">Comenzar el cuestionario</span>
      </a>
    </div>

    <footer>Hancock College &middot; CCNC 7100</footer>
  </div>
</body>
</html>
